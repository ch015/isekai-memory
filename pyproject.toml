[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "isekai-memory"
version = "0.2.0"
description = "ISEKAI central Artifact Registry and Work Handoff MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "asyncpg>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "jsonschema==4.25.1",
]

[project.scripts]
isekai-memory = "isekai_memory.main:cli"

[project.optional-dependencies]
test = ["pytest==8.4.2", "pytest-asyncio==0.26.0", "httpx==0.28.1", "ruff==0.16.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/isekai_memory"]
include = ["src/isekai_memory/**/*.py", "src/isekai_memory/schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
